# Apache in front of the app: serves port 3600 and compresses responses,
# including API JSON, which Next.js does not compress itself.
Listen 3600

<VirtualHost *:3600>
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3601/
    ProxyPassReverse / http://127.0.0.1:3601/

    AddOutputFilterByType DEFLATE application/json text/html text/css text/plain application/javascript image/svg+xml
</VirtualHost>
